function trainingPanel(){return `<section class="training-panel"><h2>ТРЕНИРОВКА БОССОВ</h2><p>Базовый щит и 3 HP. Без наград, рекордов и постоянных бонусов. Босс открывается после первой встречи.</p><div class="modes-grid">${D.bosses.map((b,i)=>{const open=save.seenBosses.includes(b.id)||save.bosses.includes(b.id);return `<article class="mode-card"><h3>${b.name}</h3><p>${b.title}</p><div class="training-buttons">${[0,1,2,3].map(phase=>`<button class="secondary" data-training="${i}" data-phase="${phase}" ${open?'':'disabled'}>${phase?'ФАЗА '+phase:'ПОЛНЫЙ БОЙ'}</button>`).join('')}</div>${open?'':'<p>Сначала встретитесь с этим боссом.</p>'}</article>`;}).join('')}</div></section>`;}
function modesPage(){return `<div class="page">${header('Выберите свой ритм','БОЕВЫЕ ПРОТОКОЛЫ','Новые условия, отдельные рекорды, тот же последний рубеж. «Чистый навык» доступен сразу.')}<div class="modes-grid">${Object.entries(modes).map(([id,m],i)=>{const open=save.modes.includes(id);return `<article class="mode-card ${mode===id?'selected':''}"><span class="mode-number">ПРОТОКОЛ / 0${i+1}</span><h3>${m.name}</h3><p>${m.desc}</p><span class="mode-bonus">${m.bonus}</span><button class="${mode===id?'primary':'secondary'}" data-mode="${id}" ${open?'':'disabled'}>${!open?id==='horizon'?'Открывается в дереве престижа':'Откроется после 60 секунд':mode===id?'Выбран · перейти к запуску ↗':'Выбрать режим ↗'}</button></article>`;}).join('')}</div>${trainingPanel()}</div>`;}
function settingsPage(){return `<div class="page">${header('Точная настройка','ПАРАМЕТРЫ СИСТЕМЫ','Соберите комфортное окружение. Настройки сохраняются автоматически.')}${store.warning?`<div class="notice">${esc(store.warning)}</div>`:''}<section class="settings-section"><h3>Язык интерфейса</h3><div class="setting-row"><span>Выбор применяется сразу и сохраняется между запусками.</span><div class="language-switch"><button data-language="ru" aria-pressed="${I.getLanguage()==='ru'}" class="${I.getLanguage()==='ru'?'selected':''}">Русский</button><button data-language="en" aria-pressed="${I.getLanguage()==='en'}" class="${I.getLanguage()==='en'?'selected':''}">English</button></div></div></section><section class="settings-section"><h3>Геймпад</h3><label class="setting-row"><span>Мёртвая зона стиков<small>От 10% до 40%. Увеличьте при дрейфе.</small></span><input type="range" min="10" max="40" value="${Math.round((save.settings.deadzone||.22)*100)}" data-setting="deadzone" aria-label="Мёртвая зона стиков"></label><p id="controller-status">${esc(controllerStatus())}</p><p>Оба стика и крестовина — направление щита. LB/RB (L1/R1) — вращение. A / ✕, X / □ или RT / R2 — Перегрузка. Start / Options — пауза. В меню: стик или крестовина — выбор, A / ✕ — подтвердить, B / ○ — назад. На ползунках громкости: влево/вправо — изменение.</p><p>Подключите контроллер по Bluetooth или USB к телефону или компьютеру. Если браузер не видит контроллер, откройте игру отдельной вкладкой. Для включения звука может потребоваться одно касание экрана или щелчок мышью.</p></section><section class="settings-section"><h3>Звук и изображение</h3><label class="setting-row"><span>Громкость эффектов<small>Отражения, предупреждения и события</small></span><input type="range" min="0" max="100" value="${save.settings.sfx*100}" data-setting="sfx" aria-label="Громкость эффектов"></label><label class="setting-row"><span>Громкость музыки<small>PULSE CIRCUIT · электронный саундтрек · 126 BPM</small></span><input type="range" min="0" max="100" value="${save.settings.music*100}" data-setting="music" aria-label="Громкость музыки"></label><label class="setting-row"><span>Уменьшить эффекты<small>Меньше частиц, без тряски. Полезно на мобильных устройствах.</small></span><input type="checkbox" data-setting="reduced" ${save.settings.reduced?'checked':''}></label></section><section class="settings-section"><h3>Сохранение и прогресс</h3><p>Прогресс хранится в этом браузере. Экспортируйте JSON, чтобы перенести его на другое устройство. Перед импортом создаётся резервная копия текущего сохранения.</p><div class="button-row"><a class="secondary" href="CORE-offline.zip" download>↓ Скачать игру</a>${button('export','↓ Экспорт JSON')}${button('import','↑ Импорт JSON')}${store.protected?button('export-raw','Скачать исходное сохранение'):''}${button('backup','Скачать резервную копию')}</div><div class="button-row">${button('reset','Сбросить прогресс','danger-button')}</div></section><section class="settings-section"><h3>Краткий протокол защиты</h3><p>Поворачивайте щит мышью, пальцем, A / D или стрелками. Щит движется с ограниченной скоростью. Пробел / Esc — пауза. Зажать щит в одном месте недостаточно: подставьте его под траекторию за 120 мс до удара для идеального отражения. Пунктирные фиолетовые лучи Фантома с меткой «ЭХО» безопасны; сплошные цветные линии показывают настоящие атаки. Боссы движутся по орбите, обычные враги начинают разгоняться после 18-й секунды. Прицел следует за врагом, затем вспыхивает и фиксируется минимум за 0,5 с до выстрела. Выпущенные снаряды не меняют направление вслед за врагом. Игра останавливается при переключении окна.</p><p>Перегрузка: E, правая кнопка мыши или кнопка над шкалой энергии. Стоимость 20 энергии, перезарядка 8 с; очищает снаряды в радиусе 140, не даёт очков и не лечит ядро. Броня босса открывается на 2,1 с после идеального отражения или на 0,65 с после каждого четвёртого блока. Игра останавливается при переключении окна.</p><h3 style="margin-top:25px">Сигнатуры противников</h3><div class="codex-list">${D.enemies.map(e=>`<div class="codex-item"><span class="codex-icon" style="color:${e.color}">${uiIcon(['◇','⬡','△','⬟','⌖','↗','⋈','◎'][D.enemies.indexOf(e)])}</span><div><strong>${e.name}</strong><small>${e.desc}<br>Доступен с ${e.unlock} с.</small></div></div>`).join('')}</div></section></div>`;}
const pageNames={home:'ОБЗОР РЕАКТОРА',upgrades:'ПОСТОЯННЫЕ ТЕХНОЛОГИИ',achievements:'ДОСТИЖЕНИЯ',records:'АРХИВ ПОПЫТОК',modes:'БОЕВЫЕ ПРОТОКОЛЫ',settings:'НАСТРОЙКИ'};
function renderPage(){const render={home,upgrades:techPage,achievements:achievementsPage,records:recordsPage,modes:modesPage,settings:settingsPage};I.translateShell(document);screen.innerHTML=h(render[page]());$('#page-label').textContent=t(pageNames[page]);$$('.nav-button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#wallet').textContent=num(save.shards);$('#sound-toggle').textContent=save.settings.sfx||save.settings.music?'♫':'♪';$('#sound-toggle').setAttribute('aria-label',save.settings.sfx||save.settings.music?t('Выключить звук'):t('Включить звук'));screen.scrollTop=0;updateControllerStatus();}
function changeLanguage(language){
 if(!['ru','en'].includes(language))return;
 save.settings.language=language;I.setLanguage(language);persist();I.translateShell(document);updateControllerStatus();
 for(const el of $('#toasts').children)el.textContent=t(el.dataset.rawMessage||el.textContent);
 $('#sound-toggle').setAttribute('aria-label',save.settings.sfx||save.settings.music?t('Выключить звук'):t('Включить звук'));
 if(!isRunning){renderPage();if(confirmationInfo&&confirmCallback){const info=confirmationInfo;confirmDialog(info.title,info.desc,confirmCallback,confirmCancel);}return;}
 renderHudShell();updateHud();
 if(confirmationInfo&&confirmCallback){const info=confirmationInfo;confirmDialog(info.title,info.desc,confirmCallback,confirmCancel);}
 else if(engine.state==='paused')showPause();else if(['upgrade','route','specialization','victory'].includes(engine.state))restoreRunModal();else if(engine.state==='dead')showResult();
}
function navigate(next){if(!pageNames[next])return;if(isRunning&&engine?.state!=='dead'){if(engine.state==='playing')pause();confirmDialog('Завершить попытку?','Попытка закончится с текущим результатом. Начисление наград происходит один раз.',()=>{finishRun();goPage(next);},()=>{restoreRunModal();});return;}goPage(next);}
function goPage(next){clearBossMoment();isRunning=false;page=next;$('#app').classList.remove('game-active');$('#hud').classList.add('hidden');$('#game-footer').classList.add('hidden');$('#boss-hud').classList.add('hidden');hideModal();renderPage();resize();}
function showModal(html){previousFocus=document.activeElement;modal.innerHTML=h(html);modal.classList.remove('hidden');requestAnimationFrame(()=>modal.querySelector('button:not([disabled])')?.focus({preventScroll:true}));}
function hideModal(){modal.classList.add('hidden');modal.innerHTML='';confirmationInfo=null;if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true});}
let confirmCallback=null,confirmCancel=null,confirmationInfo=null;
function confirmDialog(title,desc,callback,cancel){confirmationInfo={title,desc};confirmCallback=callback;confirmCancel=cancel;showModal(`<div class="dialog"><div class="eyebrow">ПОДТВЕРЖДЕНИЕ</div><h2>${title}</h2><p>${desc}</p><div class="button-row">${button('confirm','Подтвердить','primary')}${button('cancel','Отмена')}</div></div>`);}
function bossEmblem(index){return '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">'+['<path d="M20 3 35 12v16L20 37 5 28V12Z"/><path d="M11 12h18v16H11Z"/>','<path d="m20 4 6 10-6 10-6-10ZM8 22l7 4v8H4v-8Zm24 0 4 4v8H25v-8Z"/>','<path d="m20 3 16 17-16 17L4 20Z"/><path d="m20 11 9 9-9 9-9-9Z"/>','<circle cx="20" cy="20" r="16"/><circle cx="20" cy="20" r="8"/><path d="M3 20h8m18 0h8"/>'][index]+'</svg>';}
function clearBossMoment(){bossMoment?.remove();bossMoment=null;bossMomentLife=0;}
function showBossMoment(index,label,detail){clearBossMoment();const def=D.bosses[index];bossMoment=document.createElement('div');bossMoment.className='boss-moment'+(save.settings.reduced?' reduced':'');bossMoment.style.setProperty('--boss-color',def.color);bossMoment.setAttribute('role','status');bossMoment.innerHTML=h('<span class="boss-emblem">'+bossEmblem(index)+'</span><div><small>'+esc(label)+'</small><strong>'+esc(def.name)+'</strong><span>'+esc(detail)+'</span></div>');stage.append(bossMoment);bossMomentLife=2.6;}
function start(){clearBossMoment();bossPhaseSeen=0;lastBossVictory=null;audio.unlock();engine=new C.Engine(save,{mode,training:trainingSelection});runResult=null;isRunning=true;notifiedBest=false;input.angle=undefined;keys.clear();labels.length=0;$('#app').classList.add('game-active');screen.innerHTML='';hideModal();$('#hud').classList.remove('hidden');$('#game-footer').classList.remove('hidden');$('#boss-hud').classList.add('hidden');$('#page-label').textContent=t(engine?.training&&isRunning?'ТРЕНИРОВКА БОССОВ':modes[mode].name.toUpperCase());renderHudShell();resize();updateHud();canvas.focus({preventScroll:true});if(save.totals.runs===0)toast('Щит следует за курсором или пальцем. Поворачивайте его навстречу красным снарядам.');}
function renderHudShell(){$('#hud').innerHTML=h('<div class="hud-left"><div><small>ЦЕЛОСТНОСТЬ ЯДРА</small><div id="health" class="health" role="meter" aria-label="Здоровье ядра" aria-valuemin="0"></div></div><div><small>ВРЕМЯ</small><div id="run-time" class="value">00:00</div></div></div><div class="hud-right"><div><small>ОЧКИ <span id="multiplier"></span></small><div id="run-score" class="value">0</div></div><button class="hud-pause" data-action="pause" aria-label="Пауза">Ⅱ</button></div>');
 $('#game-footer').innerHTML=h('<button id="overload-button" class="secondary overload-button" data-action="overload">Перегрузка · E / ПКМ · 20 энергии</button><div class="energy-head"><span id="energy-level"></span><span id="energy-count"></span></div><div id="energy-track" class="energy-track" role="progressbar" aria-label="Боевая энергия" aria-valuemin="0"><div id="energy-fill" class="energy-fill"></div></div><div class="game-info"><span id="wave-label"></span><span class="active-build" id="active-build"></span><span id="boss-countdown"></span></div><div id="run-status" class="run-status"></div>');$('#page-label').textContent=t(engine?.training&&isRunning?'ТРЕНИРОВКА БОССОВ':modes[mode].name.toUpperCase());}
function pause(){if(!engine||engine.state!=='playing')return;engine.state='paused';keys.clear();showPause();}
function showPause(){showModal(`<div class="dialog"><div class="eyebrow">РЕАКТОР В РЕЖИМЕ ОЖИДАНИЯ</div><h2>Время перевести дух</h2><p>Продолжите, когда будете готовы.<br>Мышь / касание — направление. A / D — поворот. Пробел — пауза.</p><p class="pad-help">Геймпад: стик — щит, A / ✕ — Перегрузка, Start — пауза, B / ○ — назад.</p><div class="build-list">${D.upgrades.filter(u=>engine.u(u.id)).map(u=>`<span>${uiIcon(u.icon)} ${u.name} ${engine.u(u.id)}</span>`).join('')}</div><p>${runStatus()}</p><div class="pause-stats">${time(engine.time)} &nbsp; / &nbsp; ${num(engine.score)} очков</div><div class="button-row">${button('resume','Продолжить ↗','primary')}${button('end','Завершить попытку')}</div></div>`);}
function resume(){if(engine?.state==='paused'){engine.state='playing';hideModal();canvas.focus({preventScroll:true});}}
function upgradePreview(u){const e=engine,lv=e.u(u.id),fmt=n=>Number(n.toFixed(2));let value='';if(u.id==='wide')value=fmt(e.width/C.RAD)+'° → '+fmt(Math.min(105,e.width/C.RAD+8))+'°';if(u.id==='damage')value=fmt(e.damage)+' → '+fmt(e.damage+.6*(e.core==='storm'?.8:e.core==='mirror'?.9:1));if(u.id==='heal')value=e.hp+' → '+Math.min(e.maxHp,e.hp+1)+' HP';const pairs={chain:'crit',crit:'chain',blast:'pierce',pierce:'blast',double:'damage',damage:'double',barrier:'pcombo',pcombo:'barrier'},partner=D.upgrades.find(x=>x.id===pairs[u.id]);return '<div class="upgrade-preview"><strong>'+(value||'Уровень '+lv+' → '+(lv+1))+'</strong><small>'+(lv?'Усиление вашей сборки':'Новая возможность')+(partner?' · '+(e.u(partner.id)?'В сборке':'Сочетание')+': '+partner.name:'')+'</small></div>';}
function showUpgrade(){const e=engine;showModal(`<div class="dialog"><div class="eyebrow">ЭНЕРГИЯ СТАБИЛИЗИРОВАНА · УРОВЕНЬ ${e.level}</div><h2>Следующий шаг эволюции</h2><p>Выберите одну технологию. Действует до конца попытки.</p><div class="upgrade-options">${e.choices.map((u,i)=>`<button class="upgrade-card rarity-${u.rarity}" data-upgrade="${u.id}"><div class="card-icon">${uiIcon(u.icon)}</div><span class="rarity-label">${D.rarity[u.rarity].toUpperCase()}</span><h3>${u.name}</h3><p>${u.desc}</p>${upgradePreview(u)}${e.synergies(u.id).filter(x=>!e.synergies().some(y=>y.name===x.name)).map(x=>`<div class="synergy-hint">✦ ${x.name}: ${x.desc}</div>`).join('')}<span class="card-level">${u.category} · ${e.u(u.id)+1}/${u.max} <span style="float:right">[${i+1}]</span></span></button>`).join('')}</div><div class="key-hint">Сочетайте технологии: разряды + критические попадания, взрывы + пробивание.</div>${e.rerolls?`<div class="button-row">${button('reroll',`Заменить варианты · ${e.rerolls}`)}</div>`:''}</div>`);}
function runStatus(){if(!engine)return '';if(engine.training)return 'ТРЕНИРОВКА БОССОВ';const c=engine.contractProgress(),r=D.routes.find(x=>x.id===engine.route);return `${engine.encounter?engine.encounter.name+' · ':''}${r.name} · ${c.name}${engine.contract==='none'?'':` · ${c.done?'ВЫПОЛНЕНО':c.progress} · +${c.reward} ◈`}`;}
function restoreRunModal(){if(engine.state==='victory'){showVictory();return;}if(engine.state==='upgrade')showUpgrade();else if(engine.state==='route')showRoute();else if(engine.state==='specialization')showSpecialization();else if(engine.state==='paused')showPause();}
function showVictory(){showModal(`<div class="dialog"><div class="eyebrow">ЭКСПЕДИЦИЯ ЗАВЕРШЕНА</div><h2>Реактор спасён</h2><p>Все четыре босса побеждены. Завершите экспедицию или продолжите бесконечный режим. Награды начисляются один раз при завершении.</p><div class="button-row">${button('complete','Завершить экспедицию','primary')}${button('endless','Продолжить бесконечно')}</div></div>`);}
function runAnalysis(){const a=engine.analysis(),names={laser:'Лазер',suppressor:'Подавитель',projectile:'Снаряд',reflection:'Отражения',automation:'Автоматика',chain:'Цепь',blast:'Взрыв'};return `<div class="run-analysis"><h3>РАЗБОР ПОПЫТКИ</h3><p>Защита: ${a.accuracy}% · Блоки / блоки и полученный урон</p><p>Источники урона: ${Object.entries(a.taken).map(([id,n])=>names[id]+': '+n).join(' · ')||'—'}</p><p>Нанесённый урон: ${Object.entries(a.damage).map(([id,n])=>names[id]+': '+Math.round(n)).join(' · ')||'—'}</p><p>${a.hint}</p></div>`;}
function showRoute(){clearBossMoment();showModal(`<div class="dialog"><div class="eyebrow">БОСС ПОБЕЖДЁН · ПЕРЕДЫШКА</div>${lastBossVictory!==null?`<div class="boss-victory" style="--boss-color:${D.bosses[lastBossVictory].color}"><span class="boss-emblem">${bossEmblem(lastBossVictory)}</span><h2>${D.bosses[lastBossVictory].name}</h2><p>${D.bosses[lastBossVictory].reward}</p></div>`:''}<h2>Выберите маршрут</h2><p>Условия действуют до появления следующего босса. Время остановлено на время выбора.</p><div class="upgrade-options">${D.routes.map((r,i)=>`<button class="upgrade-card" data-route="${r.id}"><span class="rarity-label">[${i+1}]</span><h3>${r.name}</h3><p>${r.desc}</p></button>`).join('')}</div></div>`);}
function showSpecialization(){const id=engine.pendingSpec;showModal(`<div class="dialog"><div class="eyebrow">МАКСИМАЛЬНЫЙ УРОВЕНЬ</div><h2>Специализация: ${D.upgrades.find(x=>x.id===id).name}</h2><p>Выберите направление до конца попытки. Каждое усиление имеет свою цену.</p><div class="upgrade-options specialization-options">${D.specializations[id].map((b,i)=>`<button class="upgrade-card" data-specialization="${b.id}"><span class="rarity-label">[${i+1}]</span><h3>${b.name}</h3><p>${b.desc}</p></button>`).join('')}</div></div>`);}
function afterChoice(){hideModal();restoreRunModal();canvas.focus({preventScroll:true});updateHud();}
function showTrainingResult(){const r=runResult;showModal(`<div class="dialog"><div class="eyebrow">ТРЕНИРОВКА БОССОВ</div><h2>${r.victory?'Босс побеждён':'Тренировка завершена'}</h2><div class="result-hero">${time(r.time)}</div><p>Осколки, достижения и рекорды в тренировке не начисляются.</p><p>${engine.lastHit?.hint||''}</p><div class="button-row">${button('restart','Ещё раз ↗','primary')}${button('home','Главное меню')}</div></div>`);}
function finishRun(){clearBossMoment();if(!engine)return;if(engine.state!=='dead'){engine.state='dead';engine.deathReason=engine.victory?'Экспедиция завершена':'Попытка завершена вручную';}const settled=engine.settle();if(settled){runResult=settled;persist();for(const a of settled.unlocked)toast(`${a.name} · +${a.reward} осколков`,'gold');if(settled.newRecords.length){toast('Новый личный рекорд записан в архив.','gold');audio.play('record');}}showResult();}
