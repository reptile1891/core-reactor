function missionNotice(title,name,detail='',contract=false,kind=''){if(kind==='technology')missionQueue=missionQueue.filter(x=>x.kind!=='technology');if(missionQueue.some(x=>x.title===title&&x.name===name))return;missionQueue.push({title,name,detail,contract,kind,created:engine?.time||0,priority:kind==='record'?4:kind==='synergy'||contract?3:kind==='technology'?1:2});missionQueue.sort((a,b)=>b.priority-a.priority);missionQueue=missionQueue.slice(0,6);}
function updateMissionNotice(dt){
 if(!isRunning||!engine)return;
 if(engine.state==='dead'){if(missionActive||missionQueue.length)clearMissionNotices();return;}
 if(engine.contractDone&&!contractCelebrated){contractCelebrated=true;const c=engine.contractProgress();missionNotice('КОНТРАКТ ВЫПОЛНЕН',c.name,t('Награда по итогам попытки')+': +'+c.reward+' ◈',true);}
 if(engine.state!=='playing'||!modal.classList.contains('hidden')||bossMoment||engine.time<(engine.boss?.vulnerableUntil||0))return;
 missionQueue=missionQueue.filter(x=>x.contract||engine.time-x.created<18);
 if(missionActive){missionActive.life-=dt;missionActive.el.style.setProperty('--remaining',Math.max(0,missionActive.life/3.6));if(missionActive.life<=0){missionActive.el.remove();missionActive=null;}}
 if(!missionActive&&missionQueue.length){const item=missionQueue.shift(),el=document.createElement('div');el.className='mission-notice'+(item.contract?' contract':'')+(item.kind?' '+item.kind:'');el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.innerHTML='<span class="mission-emblem" aria-hidden="true">'+(item.kind==='synergy'?'ϟ':item.kind==='record'?'✦':item.kind==='technology'?'⬡':item.contract?'◇':'✓')+'</span><div><small>'+esc(t(item.title))+'</small><strong>'+esc(t(item.name))+'</strong>'+(item.detail?'<p>'+esc(t(item.detail))+'</p>':'')+'</div><i aria-hidden="true"></i>';document.body.append(el);missionActive={el,life:3.6};audio.play(item.kind==='record'?'record':item.kind==='synergy'?'synergyUnlock':item.kind==='technology'?'moduleInstall':'objectiveComplete');}
}

function header(title,eyebrow,desc,chip=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p>${desc}</p></div>${chip?`<div class="balance-chip">${chip}</div>`:''}</div>`;}

function corePicker(){return `<div class="core-picker"><small>КОНФИГУРАЦИЯ ЯДРА</small><div>${cores.map(c=>`<button data-core="${c.id}" class="${(mode==='skill'?'standard':save.settings.core||'standard')===c.id?'selected':''}" title="${c.desc}" aria-pressed="${(mode==='skill'?'standard':save.settings.core||'standard')===c.id}" ${mode==='skill'?'disabled':''}>${c.name}</button>`).join('')}</div><p>${mode==='skill'?'В чистом навыке используется стандартное ядро.':cores.find(c=>c.id===(mode==='skill'?'standard':save.settings.core||'standard')).desc}</p></div>`;}
function controllerStatus(){return !padState.available?'Геймпад недоступен в этом браузере.':!padState.connected?'Подключите геймпад и нажмите на нём любую кнопку.':padState.standard?'Геймпад подключён: '+padState.id:'Нестандартная раскладка: доступны стики, кнопки зависят от браузера.';}
function updateControllerStatus(){const icon=$('#controller-icon');if(icon){icon.classList.toggle('connected',padState.connected);icon.setAttribute('title',t(controllerStatus()));icon.setAttribute('aria-label',t(controllerStatus()));}const status=$('#controller-status');if(status)status.textContent=t(controllerStatus());}
function controllerItems(){const roots=!modal.classList.contains('hidden')?[modal]:[screen];const items=roots.flatMap(el=>[...el.querySelectorAll('button:not([disabled]),input[type="range"],input[type="checkbox"],summary')]);if(modal.classList.contains('hidden')&&!isRunning)items.push(...$$('.nav-button'),...$$('.topbar-controls button'));return items.filter(el=>!el.disabled&&(typeof el.getClientRects!=='function'||el.getClientRects().length));}
function spatialChoice(items,selected,nav){const a=selected.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;const list=items.filter(el=>el!==selected).map(el=>{const b=el.getBoundingClientRect(),dx=b.left+b.width/2-ax,dy=b.top+b.height/2-ay;const main=nav==='right'?dx:nav==='left'?-dx:nav==='down'?dy:-dy,cross=nav==='right'||nav==='left'?Math.abs(dy):Math.abs(dx);return {el,main,score:main+cross*2.5};}).filter(v=>v.main>1).sort((a,b)=>a.score-b.score);return list[0]?.el||items[(items.indexOf(selected)+(nav==='left'||nav==='up'?-1:1)+items.length)%items.length];}
function controllerMenu(nav,confirm){const items=controllerItems();if(!items.length)return;let selected=items.includes(document.activeElement)?document.activeElement:null;
 if(!selected)selected=items.find(el=>el.dataset.action==='start'||el.dataset.action==='resume'||el.dataset.action==='restart')||items[0];
 if(nav){if(selected.tagName==='INPUT'&&selected.type==='range'&&(nav==='left'||nav==='right')){selected.value=Math.max(Number(selected.min||0),Math.min(Number(selected.max||100),Number(selected.value)+(nav==='right'?5:-5)));selected.dispatchEvent(new Event('input',{bubbles:true}));return;}
 const direction=nav==='left'||nav==='up'?-1:1;selected=spatialChoice(items,selected,nav);for(const el of items)el.classList.remove('pad-focus');selected.classList.add('pad-focus');selected.focus({preventScroll:true});selected.scrollIntoView?.({block:'nearest',inline:'nearest'});}
 if(confirm)selected.click();
}
function controllerBack(){if(confirmCallback&&confirmationInfo){actions.cancel();return;}if(isRunning&&['upgrade','route','specialization','victory'].includes(engine?.state))return;if(isRunning&&engine?.state==='playing')pause();else if(isRunning&&engine?.state==='paused')resume();else goPage('home');}
function pollController(ms){if(!windowFocused||document.hidden)return null;const menu=!isRunning||engine?.state!=='playing';controller.deadzone=save.settings.deadzone||.22;const next=controller.poll(ms,menu),changed=next.changed;
 if(changed&&inputOwner==='gamepad'&&isRunning&&engine?.state==='playing'){input.angle=undefined;pause();toast('Геймпад отключён. Игра на паузе.');}
 const statusChanged=changed||next.available!==padState.available||next.standard!==padState.standard;padState=next;if(statusChanged)updateControllerStatus();if(next.confirm||next.pause||next.back||next.overload||next.nav)inputOwner='gamepad';
 if(next.pause){audio.unlock();if(engine?.state==='playing'&&isRunning)pause();else if(engine?.state==='paused'&&isRunning&&!confirmationInfo)resume();return null;}
 if(next.back){audio.unlock();controllerBack();return null;}
 if(menu){if(next.confirm||next.nav)audio.unlock();if(next.nav||next.confirm)controllerMenu(next.nav,next.confirm);return null;}
 if(next.overload){audio.unlock();engine?.overload();inputOwner='gamepad';}
 return next;
}

function researchOptions(){return D.tech.filter(x=>(save.tech[x.id]||0)<x.max).map(def=>({def,cost:D.cost(def,save.tech[def.id]||0),missing:(def.requires||[]).filter(id=>!save.tech[id])}));}
function researchPlan(){const selected=researchOptions().find(x=>x.def.id===researchTarget);return selected||nextResearch();}
function researchGuide(){return '<div class="research-directions">'+[['Корпус','Выживаемость','Больше здоровья и восстановление'],['Щит','Отражения','Шире щит и сильнее ответный удар'],['Реактор','Энергия','Больше возможностей за попытку']].map(([tab,name,desc])=>'<button data-shop-tab="'+tab+'" class="'+(shopTab===tab?'selected':'')+'" aria-pressed="'+(shopTab===tab)+'"><strong>'+name+'</strong><span>'+desc+'</span></button>').join('')+'</div><div class="research-goal">'+progressNote()+'</div>';}

function progressNote(){const next=researchPlan();return next?'<div class="progress-note"><span>'+uiIcon(next.def.icon)+'</span><div><small>'+(next.def.id===researchTarget?'Ваша цель':'Следующее исследование')+'</small><strong>'+next.def.name+'</strong><p>'+(next.missing?.length?'Сначала откройте: '+next.missing.map(id=>t(D.tech.find(x=>x.id===id).name)).join(', '):save.shards>=next.cost?'Можно открыть сейчас':'Осталось осколков: '+num(next.cost-save.shards))+'</p></div><button class="text-button" data-research-focus="'+next.def.id+'" aria-label="Открыть развитие">↗</button></div>':'';}

function prestigePage(){const allowed=C.canPrestige(save);return `<div class="prestige-banner"><h3>Перезагрузка реактора</h3><p>Необязательное новое начало. Сбросит обычные технологии и осколки. Сохраняет рекорды, достижения, открытые режимы и особое дерево. Даёт 3 редких кристалла и ещё 1 за каждые 10 приобретённых уровней.</p><p>${allowed?'Реактор готов к перезагрузке.':'Условия: победить всех 4 боссов и приобрести 12 уровней технологий.'} Сейчас: ${save.bosses.length}/4 боссов, ${Object.values(save.tech).reduce((a,b)=>a+b,0)}/12 уровней.</p>${button('prestige','Перезагрузить реактор','secondary',allowed?'':'disabled')} <span class="badge">✧ ${save.rare} кристаллов</span></div><div class="cards">${D.prestigeTech.map(t=>{const lv=save.prestigeTech[t.id]||0,price=t.cost+lv;return `<article class="tech-card"><div class="card-icon">${uiIcon(t.icon)}</div><div class="card-head"><h3>${t.name}</h3><span class="card-level">${lv}/${t.max}</span></div><p>${t.desc}</p><button class="buy-button" data-prestige-buy="${t.id}" ${lv>=t.max||save.rare<price?'disabled':''}><span>${lv>=t.max?'Завершено':'Исследовать'}</span><span>✧ ${price}</span></button></article>`;}).join('')}</div>`;}

function recordsPage(){const archive=recordsScope==='archive',rows=(archive?save.recordsArchive:save.records)[recordsTab]||[],best=(archive?save.bests:save.currentBests)[recordsTab]||{};return `<div class="page">${header('Ваш горизонт','ЛОКАЛЬНЫЕ РЕКОРДЫ','Рекорды текущих правил отделены от архива. Старый прогресс сохранён.')}${collectionNav()}<div class="button-row"><button class="${archive?'secondary':'primary'}" data-record-scope="current">Текущие правила · ${C.BALANCE}</button><button class="${archive?'primary':'secondary'}" data-record-scope="archive">Архив</button></div><div class="tabs">${Object.entries(modes).filter(([k])=>save.modes.includes(k)).map(([k,v])=>`<button class="tab ${recordsTab===k?'active':''}" data-record-tab="${k}">${v.name}</button>`).join('')}</div><div class="record-stats"><div class="mini-stat"><small>ВРЕМЯ</small><strong>${time(best.time)}</strong></div><div class="mini-stat"><small>СЕРИЯ БЛОКОВ</small><strong>${num(best.combo)}</strong></div><div class="mini-stat"><small>СЕРИЯ ИДЕАЛЬНЫХ</small><strong>${num(best.perfectCombo)}</strong></div><div class="mini-stat"><small>МАКС. ВОЛНА</small><strong>${num(best.wave)}</strong></div></div>${rows.length?`<div class="table-wrap"><table class="records-table"><thead><tr><th>№</th><th>ОЧКИ</th><th>ВРЕМЯ</th><th>ЯДРО</th><th>БАЛАНС</th><th>ВРАГОВ</th><th>ДАТА</th></tr></thead><tbody>${rows.map((row,i)=>`<tr><td>${i+1}</td><td>${num(row.score)}</td><td>${time(row.time)}</td><td>${cores.find(c=>c.id===row.core)?.name||'Неизвестно'}${row.tactic?`<small class="record-tactic">${D.tactics.find(t=>t.id===row.tactic)?.name||''}</small>`:''}</td><td>${esc(row.balance==='legacy'?'Архив':row.balance)}</td><td>${num(row.kills)}</td><td>${esc(row.date)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state">В этом разделе пока нет результатов.</div>'}<p>${archive?'Лучшие показатели за всё время сохранены.':'Сравнение и уведомления используют только текущие правила.'}</p><div class="section-sub">ЗА ВСЁ ВРЕМЯ: ${num(save.totals.runs)} ПОПЫТОК · ${num(save.totals.kills)} ВРАГОВ · ${num(save.totals.bosses)} БОССОВ</div></div>`;}
function contractPicker(){const selected=D.contracts.find(c=>c.id===save.settings.contract)||D.contracts[0];return `<div class="contract-picker"><span>КОНТРАКТ · НАГРАДА И ШТРАФ</span><p>Возьмите обязательство перед вылетом. Выполните его — получите награду; не выполните — заплатите штраф.</p>${D.contracts.map(c=>`<button class="text-button ${(save.settings.contract||'none')===c.id?'selected':''}" data-contract="${c.id}" title="${c.desc}" aria-pressed="${(save.settings.contract||'none')===c.id}">${c.name}${c.reward?`<small>+${c.reward} ◈ / −${c.penalty} ◈</small>`:''}</button>`).join('')}<p>${selected.desc}${selected.reward?' Успех: +'+selected.reward+' ◈. Провал или ранний выход: −'+selected.penalty+' ◈.':''}</p></div>`;}
function trainingPanel(){return `<section class="training-panel"><h2>ТРЕНИРОВКА БОССОВ</h2><p>Базовый щит и 3 HP. Без наград, рекордов и постоянных бонусов. Босс открывается после первой встречи.</p><div class="modes-grid">${D.bosses.map((b,i)=>{const open=save.seenBosses.includes(b.id)||save.bosses.includes(b.id);return `<article class="mode-card"><h3>${b.name}</h3><p>${b.title}</p><div class="training-buttons">${[0,1,2,3].map(phase=>`<button class="secondary" data-training="${i}" data-phase="${phase}" ${open?'':'disabled'}>${phase?'ФАЗА '+phase:'ПОЛНЫЙ БОЙ'}</button>`).join('')}</div>${open?'':'<p>Сначала встретитесь с этим боссом.</p>'}</article>`;}).join('')}</div></section>`;}
function modesPage(){return `<div class="page">${header('Выберите свой ритм','БОЕВЫЕ ПРОТОКОЛЫ','Новые условия, отдельные рекорды, тот же последний рубеж. «Чистый навык» доступен сразу.')}<div class="modes-grid">${Object.entries(modes).map(([id,m],i)=>{const open=save.modes.includes(id);return `<article class="mode-card ${mode===id?'selected':''}"><span class="mode-number">ПРОТОКОЛ / 0${i+1}</span><h3>${m.name}</h3><p>${m.desc}</p><span class="mode-bonus">${m.bonus}</span><button class="${mode===id?'primary':'secondary'}" data-mode="${id}" ${open?'':'disabled'}>${!open?id==='horizon'?'Открывается в дереве престижа':'Откроется после 60 секунд':mode===id?'Выбран · перейти к запуску ↗':'Выбрать режим ↗'}</button></article>`;}).join('')}</div>${trainingPanel()}</div>`;}
function settingsPage(){return `<div class="page">${header('Точная настройка','ПАРАМЕТРЫ СИСТЕМЫ','Соберите комфортное окружение. Настройки сохраняются автоматически.')}${store.warning?`<div class="notice">${esc(store.warning)}</div>`:''}<section class="settings-section"><h3>Язык интерфейса</h3><div class="setting-row"><span>Выбор применяется сразу и сохраняется между запусками.</span><div class="language-switch"><button data-language="ru" aria-pressed="${I.getLanguage()==='ru'}" class="${I.getLanguage()==='ru'?'selected':''}">Русский</button><button data-language="en" aria-pressed="${I.getLanguage()==='en'}" class="${I.getLanguage()==='en'?'selected':''}">English</button></div></div></section><section class="settings-section"><h3>Геймпад</h3><label class="setting-row"><span>Мёртвая зона стиков<small>От 10% до 40%. Увеличьте при дрейфе.</small></span><input type="range" min="10" max="40" value="${Math.round((save.settings.deadzone||.22)*100)}" data-setting="deadzone" aria-label="Мёртвая зона стиков"></label><p id="controller-status">${esc(controllerStatus())}</p><p>Оба стика и крестовина — направление щита. LB/RB (L1/R1) — вращение. A / ✕, X / □ или RT / R2 — Перегрузка. Start / Options — пауза. В меню: стик или крестовина — выбор, A / ✕ — подтвердить, B / ○ — назад. На ползунках громкости: влево/вправо — изменение.</p><p>Подключите контроллер по Bluetooth или USB к телефону или компьютеру. Если браузер не видит контроллер, откройте игру отдельной вкладкой. Для включения звука может потребоваться одно касание экрана или щелчок мышью.</p></section><section class="settings-section"><h3>Звук и изображение</h3><label class="setting-row"><span>Громкость эффектов<small>Отражения, предупреждения и события</small></span><input type="range" min="0" max="100" value="${save.settings.sfx*100}" data-setting="sfx" aria-label="Громкость эффектов"></label><label class="setting-row"><span>Громкость музыки<small>Шесть электронных тем · темп растёт от 126 до 156 ударов в минуту</small></span><input type="range" min="0" max="100" value="${save.settings.music*100}" data-setting="music" aria-label="Громкость музыки"></label><label class="setting-row"><span>Уменьшить эффекты<small>Меньше частиц, без тряски. Полезно на мобильных устройствах.</small></span><input type="checkbox" data-setting="reduced" ${save.settings.reduced?'checked':''}></label></section><section class="settings-section"><h3>Сохранение и прогресс</h3><p>Прогресс хранится в этом браузере. Экспортируйте JSON, чтобы перенести его на другое устройство. Перед импортом создаётся резервная копия текущего сохранения.</p><div class="button-row">${button('export','↓ Экспорт JSON')}${button('import','↑ Импорт JSON')}${store.protected?button('export-raw','Скачать исходное сохранение'):''}${button('backup','Скачать резервную копию')}</div><div class="button-row">${button('reset','Сбросить прогресс','danger-button')}</div></section><section class="settings-section"><h3>Краткий протокол защиты</h3><p>Поворачивайте щит мышью, пальцем, A / D или стрелками. Щит движется с ограниченной скоростью. Пробел / Esc — пауза. Зажать щит в одном месте недостаточно: подставьте его под траекторию за 120 мс до удара для идеального отражения. Пунктирные фиолетовые лучи Фантома с меткой «ЭХО» безопасны; сплошные цветные линии показывают настоящие атаки. Боссы движутся по орбите, обычные враги начинают разгоняться после 18-й секунды. Прицел следует за врагом, затем вспыхивает и фиксируется минимум за 0,5 с до выстрела. Выпущенные снаряды не меняют направление вслед за врагом. Игра останавливается при переключении окна.</p><p>Перегрузка: E, правая кнопка мыши или кнопка над шкалой энергии. Базовая стоимость 20 энергии, перезарядка 8 с; тактика залпа меняет их на 30 энергии и 10 с. «Резерв импульса» снижает стоимость на 2 энергии. Очищает снаряды в радиусе 140, не даёт очков и не лечит ядро. Броня босса открывается на 2,1 с после идеального отражения или на 0,65 с после каждого четвёртого блока.</p><h3 style="margin-top:25px">Сигнатуры противников</h3><div class="codex-list">${D.enemies.map(e=>`<div class="codex-item"><span class="codex-icon" style="color:${e.color}">${uiIcon(['◇','⬡','△','⬟','⌖','↗','⋈','◎'][D.enemies.indexOf(e)])}</span><div><strong>${e.name}</strong><small>${e.desc}<br>Доступен с ${e.unlock} с.</small></div></div>`).join('')}</div></section></div>`;}
const pageNames={cores:'КОЛЛЕКЦИЯ ЯДЕР',home:'ОБЗОР РЕАКТОРА',upgrades:'ПОСТОЯННЫЕ ТЕХНОЛОГИИ',achievements:'ДОСТИЖЕНИЯ',records:'АРХИВ ПОПЫТОК',modes:'БОЕВЫЕ ПРОТОКОЛЫ',settings:'НАСТРОЙКИ'};
function renderPage(preserve=false){document.body.classList.toggle('reduced-effects',save.settings.reduced);const expanded=preserve?[...screen.querySelectorAll('[data-setup][open]')].map(el=>el.dataset.setup):[];const scroll=screen.scrollTop,focused=document.activeElement,focusKey=preserve?['core','contract','shopTab','pin'].find(k=>focused?.dataset?.[k]!==undefined):null,focusValue=focusKey?focused.dataset[focusKey]:null;const render={home,upgrades:techPage,cores:coresPage,achievements:achievementsPage,records:recordsPage,modes:modesPage,settings:settingsPage};I.translateShell(document);screen.innerHTML=h(render[page]());for(const id of expanded){const el=screen.querySelector('[data-setup="'+id+'"]');if(el)el.open=true;}if(page==='upgrades'){const tab=screen.querySelector('.tabs .tab.active');if(tab){const tabs=tab.parentElement;tabs.scrollLeft+=tab.getBoundingClientRect().left-tabs.getBoundingClientRect().left-(tabs.clientWidth-tab.clientWidth)/2;}}$('#page-label').textContent=t(pageNames[page]);$$('.nav-button').forEach(b=>{const active=b.dataset.page===page||(b.dataset.page==='achievements'&&['cores','records'].includes(page));b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');b.title=t(pageNames[b.dataset.page]);});$('#wallet').textContent=num(save.shards);$('#sound-toggle').textContent=save.settings.sfx||save.settings.music?'♫':'♪';$('#sound-toggle').setAttribute('aria-label',save.settings.sfx||save.settings.music?t('Выключить звук'):t('Включить звук'));screen.scrollTop=preserve?scroll:0;if(focusKey){const el=[...screen.querySelectorAll('button')].find(b=>b.dataset[focusKey]===focusValue);el?.focus({preventScroll:true});}updateControllerStatus();}
function changeLanguage(language){
 if(!['ru','en'].includes(language))return;
 save.settings.language=language;I.setLanguage(language);persist();I.translateShell(document);updateControllerStatus();
 for(const el of $('#toasts').children)el.textContent=t(el.dataset.rawMessage||el.textContent);
 $('#sound-toggle').setAttribute('aria-label',save.settings.sfx||save.settings.music?t('Выключить звук'):t('Включить звук'));
 if(!isRunning){renderPage();if(confirmationInfo&&confirmCallback){const info=confirmationInfo;confirmDialog(info.title,info.desc,confirmCallback,confirmCancel);}return;}
 renderHudShell();updateHud();
 if(confirmationInfo&&confirmCallback){const info=confirmationInfo;confirmDialog(info.title,info.desc,confirmCallback,confirmCancel);}
 else if(engine.state==='paused')showPause();else if(['upgrade','route','specialization','victory'].includes(engine.state))restoreRunModal();else if(engine.state==='dead')showResult();
}
function navigate(next){if(!pageNames[next])return;if(isRunning&&engine?.state!=='dead'){if(engine.state==='playing')pause();confirmDialog('Завершить попытку?','Попытка закончится с текущим результатом. Начисление наград происходит один раз.',()=>{finishRun();goPage(next);},()=>{restoreRunModal();});return;}goPage(next);}
function goPage(next){clearMissionNotices();clearBossMoment();isRunning=false;updateBuildStyle();page=next;$('#app').classList.remove('game-active');$('#hud').classList.add('hidden');$('#game-footer').classList.add('hidden');$('#boss-hud').classList.add('hidden');hideModal();renderPage();resize();}
function showModal(html){previousFocus=document.activeElement;modal.innerHTML=h(html);decorateEventModal();modal.classList.remove('hidden');requestAnimationFrame(()=>modal.querySelector('button:not([disabled])')?.focus({preventScroll:true}));}
function decorateEventModal(){
 const state=isRunning?engine?.state:null,dialog=modal.querySelector('.dialog');if(!dialog)return;
 if(['upgrade','specialization','route','victory'].includes(state)){
 dialog.classList.add('neon-event','event-'+state);
 const crest=document.createElement('div');crest.className='event-crest';crest.setAttribute('aria-hidden','true');crest.textContent=state==='upgrade'?String(engine.level).padStart(2,'0'):state==='specialization'?'✦':state==='route'?'◇':'✺';dialog.prepend(crest);
 }
 if(state==='dead'&&runResult){dialog.querySelector('.result-quick-actions')?.insertAdjacentHTML('afterend',h(resultChronicle()));const awards=document.createElement('section');awards.className='event-awards';
 const entries=(runResult.unlocked||[]).map(a=>({name:a.name,title:a.legendary?'ЛЕГЕНДАРНОЕ':'ДОСТИЖЕНИЕ',legendary:a.legendary}));
 if(runResult.newRecords?.length)entries.unshift({name:'Новый личный рекорд',title:'РЕКОРД',legendary:true});
 awards.innerHTML=entries.map(a=>'<article class="event-award '+(a.legendary?'legendary':'')+'"><span aria-hidden="true">✦</span><div><small>'+esc(t(a.title))+'</small><strong>'+esc(t(a.name))+'</strong></div></article>').join('');if(entries.length)(dialog.querySelector('.run-chronicle')||dialog.querySelector('.result-quick-actions'))?.after(awards);
 }
}
function hideModal(){modal.classList.add('hidden');modal.innerHTML='';confirmationInfo=null;if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true});}
let confirmCallback=null,confirmCancel=null,confirmationInfo=null;
function confirmDialog(title,desc,callback,cancel){confirmationInfo={title,desc};confirmCallback=callback;confirmCancel=cancel;showModal(`<div class="dialog"><div class="eyebrow">ПОДТВЕРЖДЕНИЕ</div><h2>${title}</h2><p>${desc}</p><div class="button-row">${button('confirm','Подтвердить','primary')}${button('cancel','Отмена')}</div></div>`);}
function bossEmblem(index){return '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">'+['<path d="M20 3 35 12v16L20 37 5 28V12Z"/><path d="M11 12h18v16H11Z"/>','<path d="m20 4 6 10-6 10-6-10ZM8 22l7 4v8H4v-8Zm24 0 4 4v8H25v-8Z"/>','<path d="m20 3 16 17-16 17L4 20Z"/><path d="m20 11 9 9-9 9-9-9Z"/>','<circle cx="20" cy="20" r="16"/><circle cx="20" cy="20" r="8"/><path d="M3 20h8m18 0h8"/>'][index]+'</svg>';}
function clearBossMoment(){bossMoment?.remove();bossMoment=null;bossMomentLife=0;}
const bossCombatHints=['Отражайте серии, чтобы открыть броню.','После потери секции ритм атак меняется.','Пунктирный луч — безопасное эхо.','Следите за изгибом траекторий.'];
function showBossMoment(index,label,detail){clearBossMoment();const def=D.bosses[index];bossMoment=document.createElement('div');bossMoment.className='boss-moment'+(save.settings.reduced?' reduced':'');bossMoment.style.setProperty('--boss-color',def.color);bossMoment.setAttribute('role','status');bossMoment.innerHTML=h('<span class="boss-emblem">'+bossEmblem(index)+'</span><div><small>'+esc(label)+'</small><strong>'+esc(def.name)+'</strong><span>'+esc(detail)+'</span></div>');stage.append(bossMoment);bossMomentLife=2.6;}
function start(){clearMissionNotices();for(const el of $('#toasts').children)el.remove();document.body.classList.toggle('reduced-effects',save.settings.reduced);clearBossMoment();bossPhaseSeen=0;lastBossVictory=null;audio.unlock();engine=new C.Engine(save,{mode,training:trainingSelection,daily:dailySelection});pixoRun('run-start');runResult=null;isRunning=true;notifiedBest=false;input.angle=undefined;keys.clear();labels.length=0;coreDamageGlow=0;$('#app').classList.add('game-active');screen.innerHTML='';hideModal();$('#hud').classList.remove('hidden');$('#game-footer').classList.remove('hidden');$('#boss-hud').classList.add('hidden');$('#page-label').textContent=t(engine?.daily?'ИСПЫТАНИЕ ДНЯ':engine?.training&&isRunning?'ТРЕНИРОВКА БОССОВ':modes[mode].name.toUpperCase());renderHudShell();resize();updateHud();canvas.focus({preventScroll:true});}
function renderHudShell(){$('#hud').innerHTML=h('<div class="hud-left"><div><small>ЦЕЛОСТНОСТЬ ЯДРА</small><div id="health" class="health" role="meter" aria-label="Здоровье ядра" aria-valuemin="0"></div></div><div><small>ВРЕМЯ</small><div id="run-time" class="value">00:00</div></div></div><div class="hud-right"><div><small>ОЧКИ <span id="multiplier"></span></small><div id="run-score" class="value">0</div></div><button class="hud-pause" data-action="pause" aria-label="Пауза">Ⅱ</button></div>');

function drawSectorIdentity(e){

}

 const periods={turret:(5-(e.u('turret')-1)*.6)*(e.spec.turret==='rapid'?.65:e.spec.turret==='heavy'?1.3:1),drone:6-(e.u('drone')-1)*.7,aura:4,interceptor:12};

 const count=128,rotation=time*.065,halfWidth=depth*17;
 ctx.save();
 for(let i=0;i<count;i++){
  const points=[];
  for(const [step,side] of [[i,-1],[i+1,-1],[i+1,1],[i,1]]){
   const u=step/count*C.TAU,a=u+rotation;
   const r=C.orbitRadius(a,time,base)+side*halfWidth*Math.cos(u/2);
   points.push(C.pos(a,r));
  }
  const front=Math.sin((i+.5)/count*C.TAU/2);
  ctx.beginPath();points.forEach((p,j)=>j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
  ctx.fillStyle='rgba(112,111,255,'+(depth*(.035+.07*front))+')';ctx.fill();
  for(const pair of [[0,1],[3,2]]){const a=points[pair[0]],b=points[pair[1]];line(a.x,a.y,b.x,b.y,'rgba(146,158,255,'+(depth*.48)+')',.8);}
 }
 ctx.restore();
}
